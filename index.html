<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Despesas — Casa</title>
<meta name="theme-color" content="#14171a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despesas Casa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg: #14171a;
  --panel: #1d2126;
  --panel-2: #23282e;
  --line: #33393f;
  --ink: #eceef0;
  --ink-dim: #9aa3ab;
  --elec: #e8c14d;
  --elec-dim: #4a4227;
  --water: #4fc3c9;
  --water-dim: #1f3b3d;
  --danger: #e2685f;
  --warn: #e2a15f;
  --radius: 10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;}
.num{font-family:'JetBrains Mono',monospace; font-variant-numeric: tabular-nums;}
.app{max-width:980px;margin:0 auto;padding:28px 20px 80px;}

.header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap;}
.header input.house-name{background:transparent;border:none;color:var(--ink);font-size:22px;font-weight:700;letter-spacing:-0.01em;border-bottom:1px solid transparent;padding:0;max-width:340px;}
.header input.house-name:focus{outline:none;border-bottom:1px solid var(--line);}
.subtitle{color:var(--ink-dim); font-size:13px; margin:2px 0 24px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;}
.tab{padding:10px 16px;cursor:pointer;color:var(--ink-dim);font-size:14px;font-weight:500;border-bottom:2px solid transparent;user-select:none;}
.tab.active{color:var(--ink);border-bottom-color:var(--elec);}
.tab:hover{color:var(--ink);}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-bottom:16px;}
.card h2{font-size:14px;font-weight:600;margin:0 0 4px;color:var(--ink-dim);}
.card .card-sub{font-size:12px;color:var(--ink-dim);margin:0 0 16px;opacity:.85;line-height:1.5;}
.card.elec-card{border-left:3px solid var(--elec);}
.card.water-card{border-left:3px solid var(--water);}

.subsection{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-dim);margin:14px 0 8px;}
.subsection:first-of-type{margin-top:0;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px;}
.field input, .field select{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;font-size:14px;font-family:'JetBrains Mono',monospace;}
.field input:focus, .field select:focus{outline:none;border-color:var(--elec);}
.field input.text-input{font-family:'Inter',sans-serif;}

.hint{font-size:11.5px;color:var(--ink-dim);margin-top:-10px;margin-bottom:14px;}
.hint.warn{color:var(--warn);}

.btn{background:var(--panel-2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 16px; font-size:13.5px; font-weight:500; cursor:pointer;}
.btn:hover{border-color:#4a5158;}
.btn-primary{background:var(--elec-dim); border-color:var(--elec); color:var(--elec);}
.btn-primary:hover{background:#544a2c;}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.results{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;}
@media(max-width:640px){.results{grid-template-columns:1fr;}}
.apt-result{border-radius:var(--radius); padding:18px; border:1px solid var(--line); background:var(--panel-2);}
.apt-result .apt-name{font-size:13px; color:var(--ink-dim); margin-bottom:12px; font-weight:600;}
.readout{padding:8px 0;border-bottom:1px dashed var(--line);}
.readout:last-of-type{border-bottom:none;}
.readout .row1{display:flex;justify-content:space-between;align-items:baseline;}
.readout .lbl{font-size:12.5px;color:var(--ink-dim);}
.readout .val{font-family:'JetBrains Mono',monospace;font-size:15px;}
.readout .meta{font-size:11px;color:var(--ink-dim);margin-top:2px;}
.readout.elec .val{color:var(--elec);}
.readout.water .val{color:var(--water);}
.readout.total{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);border-bottom:none;}
.readout.total .val{font-size:20px;font-weight:700;color:var(--ink);}

.tenant-msg{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
.tenant-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;}
.tenant-line .share{font-family:'JetBrains Mono',monospace;color:var(--ink-dim);}
.wa-link{display:inline-flex;align-items:center;gap:6px;background:#1f3b30;border:1px solid #2f6b4f;color:#6fd39a;padding:5px 10px;border-radius:6px;font-size:12.5px;text-decoration:none;white-space:nowrap;}
.wa-link:hover{background:#28503f;}

.tenant-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.tenant-row input{flex:1;}
.remove-x{cursor:pointer;color:var(--danger);font-size:16px;padding:0 6px;user-select:none;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--ink-dim);font-weight:500;font-size:11.5px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
td.name{font-family:'Inter',sans-serif;}
tr:last-child td{border-bottom:none;}
.empty-state{color:var(--ink-dim);font-size:13.5px;padding:20px 4px;text-align:center;}
.table-scroll{overflow-x:auto;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--elec);color:var(--elec);padding:10px 18px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:50;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY_CONFIG = 'config';
const STORAGE_KEY_RECORDS = 'records';

let config = {
  houseName: 'A Minha Casa',
  apartments: {
    A: { name: 'T2 Casal dos Cortezes nº51', tenants: [] },
    B: { name: 'T3 Casal dos Cortezes nº51', tenants: [] }
  }
};
let records = [];
let activeTab = 'calc';
let draft = null;

function uid(){ return Math.random().toString(36).slice(2,10); }
function currentPeriod(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function shiftMonth(period, delta){
  const [y,m] = period.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function periodLabel(p){
  if(!p) return '—';
  const [y,m] = p.split('-');
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return meses[parseInt(m,10)-1] + ' ' + y;
}
function fmtEUR(n){
  if(isNaN(n)) n = 0;
  return n.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
}
function fmtNum(n){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return n.toLocaleString('pt-PT',{maximumFractionDigits:2});
}

// Defaults: leitura do contador = mês anterior; fatura da eletricidade = 2 meses antes; fatura da água = 3 meses antes
function newDraft(){
  const current = currentPeriod();
  return {
    id: null,
    readingPeriodElec: shiftMonth(current, -1),
    contadorEletricidadeA: '',
    contadorEletricidadeB: '',
    invoicePeriodElec: shiftMonth(current, -2),
    precoEletricidade: '',
    readingPeriodWater: shiftMonth(current, -1),
    contadorAguaA: '',
    contadorAguaB: '',
    invoicePeriodWater: shiftMonth(current, -3),
    precoAgua: ''
  };
}

async function loadAll(){
  try{ const c = localStorage.getItem(STORAGE_KEY_CONFIG); if(c) config = JSON.parse(c); }catch(e){}
  try{ const r = localStorage.getItem(STORAGE_KEY_RECORDS); if(r) records = JSON.parse(r); }catch(e){}
  draft = newDraft();
  render();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  }
}
async function saveConfig(){ try{ localStorage.setItem(STORAGE_KEY_CONFIG, JSON.stringify(config)); }catch(e){ showToast('Erro ao guardar configuração'); } }
async function saveRecords(){ try{ localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records)); }catch(e){ showToast('Erro ao guardar histórico'); } }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

// Find the most recent OTHER record with a smaller value of `field` than `value`
function findPrevRecord(field, value, excludeId){
  return records
    .filter(r => r.id !== excludeId && r[field] && r[field] < value)
    .sort((a,b)=> a[field] < b[field] ? 1 : -1)[0] || null;
}

function computeSplit(curA, curB, prevA, prevB){
  if(prevA===null || prevB===null || isNaN(prevA) || isNaN(prevB)){
    return { consA:null, consB:null, pctA:50, pctB:50, hasPrev:false };
  }
  let consA = curA - prevA;
  let consB = curB - prevB;
  const rawA = consA, rawB = consB;
  if(consA < 0) consA = 0;
  if(consB < 0) consB = 0;
  const total = consA + consB;
  const pctA = total > 0 ? (consA/total*100) : 50;
  return { consA: rawA, consB: rawB, pctA, pctB: 100-pctA, hasPrev:true, negative: rawA<0 || rawB<0 };
}

function calc(rec){
  const prevElec = findPrevRecord('readingPeriodElec', rec.readingPeriodElec, rec.id);
  const elecSplit = computeSplit(
    parseFloat(rec.contadorEletricidadeA), parseFloat(rec.contadorEletricidadeB),
    prevElec ? parseFloat(prevElec.contadorEletricidadeA) : null,
    prevElec ? parseFloat(prevElec.contadorEletricidadeB) : null
  );
  const prevWater = findPrevRecord('readingPeriodWater', rec.readingPeriodWater, rec.id);
  const waterSplit = computeSplit(
    parseFloat(rec.contadorAguaA), parseFloat(rec.contadorAguaB),
    prevWater ? parseFloat(prevWater.contadorAguaA) : null,
    prevWater ? parseFloat(prevWater.contadorAguaB) : null
  );
  const preLuz = parseFloat(rec.precoEletricidade) || 0;
  const preAgua = parseFloat(rec.precoAgua) || 0;

  const A = {
    pctElec: elecSplit.pctA, consElec: elecSplit.consA, hasPrevElec: elecSplit.hasPrev,
    pctAgua: waterSplit.pctA, consAgua: waterSplit.consA, hasPrevAgua: waterSplit.hasPrev,
    luz: preLuz * elecSplit.pctA/100,
    agua: preAgua * waterSplit.pctA/100
  };
  A.total = A.luz + A.agua;
  const B = {
    pctElec: elecSplit.pctB, consElec: elecSplit.consB, hasPrevElec: elecSplit.hasPrev,
    pctAgua: waterSplit.pctB, consAgua: waterSplit.consB, hasPrevAgua: waterSplit.hasPrev,
    luz: preLuz * elecSplit.pctB/100,
    agua: preAgua * waterSplit.pctB/100
  };
  B.total = B.luz + B.agua;
  return { A, B, elecNegative: elecSplit.negative, waterNegative: waterSplit.negative, prevElec, prevWater };
}

function waLink(phone, text){
  const digits = (phone||'').replace(/[^0-9]/g,'');
  return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text);
}

function buildMessage(aptKey, res, rec, tenantName, share){
  const aptName = config.apartments[aptKey].name;
  return `Olá ${tenantName}, aqui está a conta referente a ${aptName}:\n` +
    `- Eletricidade (fatura de ${periodLabel(rec.invoicePeriodElec)}): ${fmtEUR(res.luz)}\n` +
    `- Água (fatura de ${periodLabel(rec.invoicePeriodWater)}): ${fmtEUR(res.agua)}\n` +
    `- Total: ${fmtEUR(res.total)}` +
    (share !== res.total ? `\n- A sua parte: ${fmtEUR(share)}` : '') +
    `\n\nObrigado!`;
}

function buildDocsText(rec, r){
  const lines = [];
  lines.push(`Despesas — Fatura eletricidade: ${periodLabel(rec.invoicePeriodElec)} (leitura ${periodLabel(rec.readingPeriodElec)}) · Fatura água: ${periodLabel(rec.invoicePeriodWater)} (leitura ${periodLabel(rec.readingPeriodWater)})`);
  lines.push('='.repeat(40));
  lines.push(`Preço eletricidade: ${fmtEUR(parseFloat(rec.precoEletricidade)||0)}`);
  lines.push(`Preço água: ${fmtEUR(parseFloat(rec.precoAgua)||0)}`);
  lines.push('');
  ['A','B'].forEach(k=>{
    const res = r[k];
    lines.push(`${config.apartments[k].name}`);
    lines.push(`  Eletricidade: ${res.pctElec.toFixed(1)}% (${fmtNum(res.consElec)} unid.) — ${fmtEUR(res.luz)}`);
    lines.push(`  Água: ${res.pctAgua.toFixed(1)}% (${fmtNum(res.consAgua)} unid.) — ${fmtEUR(res.agua)}`);
    lines.push(`  Total: ${fmtEUR(res.total)}`);
    const tenants = config.apartments[k].tenants;
    if(tenants.length){
      const share = res.total / tenants.length;
      tenants.forEach(t=> lines.push(`  - ${t.name}: ${fmtEUR(share)}`));
    }
    lines.push('');
  });
  return lines.join('\n');
}

async function copyDocsText(rec, r){
  const text = buildDocsText(rec, r);
  try{ await navigator.clipboard.writeText(text); showToast('Texto copiado — cola no Google Docs (Ctrl/Cmd+V)'); }
  catch(e){ showToast('Não foi possível copiar automaticamente'); }
}

async function saveCurrentRecord(){
  if(!draft.precoEletricidade && !draft.precoAgua){
    showToast('Preenche pelo menos um dos preços');
    return;
  }
  let existingIdx = -1;
  if(draft.id){ existingIdx = records.findIndex(r=>r.id===draft.id); }
  else{ existingIdx = records.findIndex(r=>r.readingPeriodElec===draft.readingPeriodElec); }
  const rec = { ...draft, id: draft.id || uid() };
  if(existingIdx >= 0){ records[existingIdx] = rec; } else { records.push(rec); }
  records.sort((a,b)=> a.readingPeriodElec < b.readingPeriodElec ? 1 : -1);
  await saveRecords();
  showToast('Registo guardado');
  draft = rec;
  render();
}

function deleteRecord(id){ records = records.filter(r=>r.id!==id); saveRecords(); render(); }
function loadRecordIntoDraft(rec){ draft = { ...rec }; activeTab = 'calc'; render(); }
function startNewRecord(){ draft = newDraft(); render(); }

function addTenant(aptKey){ config.apartments[aptKey].tenants.push({id:uid(), name:'', phone:''}); render(); }
function removeTenant(aptKey, id){ config.apartments[aptKey].tenants = config.apartments[aptKey].tenants.filter(t=>t.id!==id); saveConfig(); render(); }

function el(html){ const div = document.createElement('div'); div.innerHTML = html.trim(); return div.firstChild; }

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  if(activeTab==='calc') app.appendChild(renderCalc());
  if(activeTab==='tenants') app.appendChild(renderTenants());
  if(activeTab==='history') app.appendChild(renderHistory());
}

function renderHeader(){
  const wrap = el(`<div>
    <div class="header"><input class="house-name" id="houseNameInput" value="${config.houseName.replace(/"/g,'&quot;')}" /></div>
    <div class="subtitle">Divisão de eletricidade e água entre as duas frações, a partir das leituras dos contadores</div>
  </div>`);
  wrap.querySelector('#houseNameInput').addEventListener('change', e=>{ config.houseName = e.target.value || 'A Minha Casa'; saveConfig(); });
  return wrap;
}

function renderTabs(){
  const tabs = [['calc','Calculadora'],['tenants','Inquilinos'],['history','Histórico']];
  const wrap = el('<div class="tabs"></div>');
  tabs.forEach(([key,label])=>{
    const t = el(`<div class="tab${activeTab===key?' active':''}">${label}</div>`);
    t.addEventListener('click', ()=>{ activeTab = key; render(); });
    wrap.appendChild(t);
  });
  return wrap;
}

function renderCalc(){
  const wrap = el('<div></div>');
  const prevElec = findPrevRecord('readingPeriodElec', draft.readingPeriodElec, draft.id);
  const prevWater = findPrevRecord('readingPeriodWater', draft.readingPeriodWater, draft.id);

  const elecCard = el(`<div class="card elec-card">
    <h2>Eletricidade</h2>
    <div class="card-sub">${prevElec ? 'Leitura anterior (' + periodLabel(prevElec.readingPeriodElec) + '): ' + config.apartments.A.name + ' ' + fmtNum(parseFloat(prevElec.contadorEletricidadeA)) + ' · ' + config.apartments.B.name + ' ' + fmtNum(parseFloat(prevElec.contadorEletricidadeB)) : 'Sem leitura anterior — grava este registo para calcular o consumo no próximo'}</div>
    <div class="subsection">Leitura do contador</div>
    <div class="grid3">
      <div class="field"><label>Mês da leitura</label><input type="month" id="in-readElec" value="${draft.readingPeriodElec}"></div>
      <div class="field"><label>Contador ${config.apartments.A.name}</label><input type="number" step="0.01" id="in-contA" placeholder="0" value="${draft.contadorEletricidadeA}"></div>
      <div class="field"><label>Contador ${config.apartments.B.name}</label><input type="number" step="0.01" id="in-contB" placeholder="0" value="${draft.contadorEletricidadeB}"></div>
    </div>
    <div class="subsection">Fatura</div>
    <div class="grid3">
      <div class="field"><label>Mês a que a fatura se refere</label><input type="month" id="in-invElec" value="${draft.invoicePeriodElec}"></div>
      <div class="field"><label>Preço da fatura (€)</label><input type="number" step="0.01" id="in-luz" placeholder="0.00" value="${draft.precoEletricidade}"></div>
      <div></div>
    </div>
  </div>`);
  elecCard.querySelector('#in-readElec').addEventListener('change', e=>{ draft.readingPeriodElec = e.target.value; render(); });
  elecCard.querySelector('#in-invElec').addEventListener('change', e=>{ draft.invoicePeriodElec = e.target.value; render(); });
  elecCard.querySelector('#in-luz').addEventListener('input', e=>{ draft.precoEletricidade = e.target.value; refreshResults(); });
  elecCard.querySelector('#in-contA').addEventListener('input', e=>{ draft.contadorEletricidadeA = e.target.value; refreshResults(); });
  elecCard.querySelector('#in-contB').addEventListener('input', e=>{ draft.contadorEletricidadeB = e.target.value; refreshResults(); });
  wrap.appendChild(elecCard);

  const waterCard = el(`<div class="card water-card">
    <h2>Água</h2>
    <div class="card-sub">${prevWater ? 'Leitura anterior (' + periodLabel(prevWater.readingPeriodWater) + '): ' + config.apartments.A.name + ' ' + fmtNum(parseFloat(prevWater.contadorAguaA)) + ' · ' + config.apartments.B.name + ' ' + fmtNum(parseFloat(prevWater.contadorAguaB)) : 'Sem leitura anterior — grava este registo para calcular o consumo no próximo'}</div>
    <div class="subsection">Leitura do contador</div>
    <div class="grid3">
      <div class="field"><label>Mês da leitura</label><input type="month" id="in-readAgua" value="${draft.readingPeriodWater}"></div>
      <div class="field"><label>Contador ${config.apartments.A.name}</label><input type="number" step="0.01" id="in-aguaA" placeholder="0" value="${draft.contadorAguaA}"></div>
      <div class="field"><label>Contador ${config.apartments.B.name}</label><input type="number" step="0.01" id="in-aguaB" placeholder="0" value="${draft.contadorAguaB}"></div>
    </div>
    <div class="subsection">Fatura</div>
    <div class="grid3">
      <div class="field"><label>Mês a que a fatura se refere</label><input type="month" id="in-invAgua" value="${draft.invoicePeriodWater}"></div>
      <div class="field"><label>Preço da fatura (€)</label><input type="number" step="0.01" id="in-agua" placeholder="0.00" value="${draft.precoAgua}"></div>
      <div></div>
    </div>
  </div>`);
  waterCard.querySelector('#in-readAgua').addEventListener('change', e=>{ draft.readingPeriodWater = e.target.value; render(); });
  waterCard.querySelector('#in-invAgua').addEventListener('change', e=>{ draft.invoicePeriodWater = e.target.value; render(); });
  waterCard.querySelector('#in-agua').addEventListener('input', e=>{ draft.precoAgua = e.target.value; refreshResults(); });
  waterCard.querySelector('#in-aguaA').addEventListener('input', e=>{ draft.contadorAguaA = e.target.value; refreshResults(); });
  waterCard.querySelector('#in-aguaB').addEventListener('input', e=>{ draft.contadorAguaB = e.target.value; refreshResults(); });
  wrap.appendChild(waterCard);

  const resultsCard = el('<div class="card"><h2>Resultado</h2><div class="results" id="results-slot"></div><div class="btn-row" style="margin-top:16px;"><button class="btn btn-primary" id="btn-save">Guardar registo</button><button class="btn" id="btn-copy-docs">Copiar resumo para Google Docs</button><button class="btn" id="btn-new">Novo registo</button></div></div>');
  wrap.appendChild(resultsCard);
  wrap.appendChild(el('<div style="font-size:12px;color:var(--ink-dim);margin-top:-4px;">Para publicar automaticamente no Google Docs, liga a tua conta do Google Drive — diz-me se queres configurar isso.</div>'));

  setTimeout(()=>{
    renderResultsInto(resultsCard.querySelector('#results-slot'));
    resultsCard.querySelector('#btn-save').addEventListener('click', saveCurrentRecord);
    resultsCard.querySelector('#btn-copy-docs').addEventListener('click', ()=> copyDocsText(draft, calc(draft)));
    resultsCard.querySelector('#btn-new').addEventListener('click', startNewRecord);
  },0);

  return wrap;
}

function refreshResults(){
  const slot = document.getElementById('results-slot');
  if(slot) renderResultsInto(slot);
}

function renderResultsInto(slot){
  slot.innerHTML = '';
  const r = calc(draft);
  ['A','B'].forEach(k=>{
    const apt = config.apartments[k];
    const res = r[k];
    const elecMeta = res.hasPrevElec ? `${res.pctElec.toFixed(1)}% · ${fmtNum(res.consElec)} unid. consumidas` : `${res.pctElec.toFixed(1)}% (sem histórico, 50/50 por defeito)`;
    const aguaMeta = res.hasPrevAgua ? `${res.pctAgua.toFixed(1)}% · ${fmtNum(res.consAgua)} unid. consumidas` : `${res.pctAgua.toFixed(1)}% (sem histórico, 50/50 por defeito)`;
    const card = el(`<div class="apt-result">
      <div class="apt-name">${apt.name}</div>
      <div class="readout elec">
        <div class="row1"><span class="lbl">Eletricidade</span><span class="val num">${fmtEUR(res.luz)}</span></div>
        <div class="meta">${elecMeta}</div>
      </div>
      <div class="readout water">
        <div class="row1"><span class="lbl">Água</span><span class="val num">${fmtEUR(res.agua)}</span></div>
        <div class="meta">${aguaMeta}</div>
      </div>
      <div class="readout total"><div class="row1"><span class="lbl">Total</span><span class="val num">${fmtEUR(res.total)}</span></div></div>
      <div class="tenant-msg" id="tenants-${k}"></div>
    </div>`);
    const tSlot = card.querySelector(`#tenants-${k}`);
    if(apt.tenants.length===0){
      tSlot.innerHTML = '<div style="font-size:12px;color:var(--ink-dim);">Sem inquilinos associados — adiciona em "Inquilinos"</div>';
    }else{
      const share = res.total / apt.tenants.length;
      apt.tenants.forEach(t=>{
        const msg = buildMessage(k, res, draft, t.name || 'inquilino', share);
        const row = el(`<div class="tenant-line">
          <span>${t.name || '(sem nome)'} <span class="share">${fmtEUR(share)}</span></span>
          <a class="wa-link" target="_blank" href="${waLink(t.phone, msg)}">Enviar WhatsApp</a>
        </div>`);
        tSlot.appendChild(row);
      });
    }
    slot.appendChild(card);
  });
  if(r.elecNegative){ slot.appendChild(el('<div class="hint warn" style="grid-column:1/-1;">A leitura de eletricidade de uma das frações é inferior à do mês anterior — verifica os valores.</div>')); }
  if(r.waterNegative){ slot.appendChild(el('<div class="hint warn" style="grid-column:1/-1;">A leitura de água de uma das frações é inferior à do mês anterior — verifica os valores.</div>')); }
}

function renderTenants(){
  const wrap = el('<div class="grid2"></div>');
  ['A','B'].forEach(k=>{
    const apt = config.apartments[k];
    const card = el(`<div class="card">
      <div class="field"><label>Nome da fração</label><input class="text-input" id="apt-name-${k}" value="${apt.name.replace(/"/g,'&quot;')}"></div>
      <div id="tenant-list-${k}"></div>
      <div class="btn-row"><button class="btn btn-sm" id="add-tenant-${k}">+ Adicionar inquilino</button></div>
    </div>`);
    card.querySelector(`#apt-name-${k}`).addEventListener('change', e=>{ apt.name = e.target.value || apt.name; saveConfig(); render(); });
    const list = card.querySelector(`#tenant-list-${k}`);
    if(apt.tenants.length===0){ list.appendChild(el('<div class="empty-state">Ainda não há inquilinos nesta fração</div>')); }
    apt.tenants.forEach(t=>{
      const row = el(`<div class="tenant-row">
        <input class="text-input" placeholder="Nome" value="${t.name.replace(/"/g,'&quot;')}">
        <input placeholder="Contacto (WhatsApp c/ indicativo, ex: 351912345678)" value="${t.phone}">
        <span class="remove-x">✕</span>
      </div>`);
      const [nameInput, phoneInput] = row.querySelectorAll('input');
      nameInput.addEventListener('change', e=>{ t.name = e.target.value; saveConfig(); });
      phoneInput.addEventListener('change', e=>{ t.phone = e.target.value; saveConfig(); });
      row.querySelector('.remove-x').addEventListener('click', ()=> removeTenant(k, t.id));
      list.appendChild(row);
    });
    card.querySelector(`#add-tenant-${k}`).addEventListener('click', ()=> addTenant(k));
    wrap.appendChild(card);
  });
  return wrap;
}

function renderHistory(){
  const wrap = el('<div class="card"><h2>Histórico de meses</h2></div>');
  if(records.length===0){ wrap.appendChild(el('<div class="empty-state">Ainda não guardaste nenhum mês</div>')); return wrap; }
  const scroll = el('<div class="table-scroll"></div>');
  const table = el(`<table>
    <thead><tr>
      <th>Leitura Luz</th><th>Fatura Luz</th><th>Preço Luz</th>
      <th>Leitura Água</th><th>Fatura Água</th><th>Preço Água</th>
      <th>% Luz ${config.apartments.A.name}</th><th>% Água ${config.apartments.A.name}</th>
      <th>Total ${config.apartments.A.name}</th><th>Total ${config.apartments.B.name}</th><th></th>
    </tr></thead>
    <tbody></tbody>
  </table>`);
  const tbody = table.querySelector('tbody');
  records.forEach(rec=>{
    const r = calc(rec);
    const tr = el(`<tr>
      <td class="name">${periodLabel(rec.readingPeriodElec)}</td>
      <td class="name">${periodLabel(rec.invoicePeriodElec)}</td>
      <td>${fmtEUR(parseFloat(rec.precoEletricidade)||0)}</td>
      <td class="name">${periodLabel(rec.readingPeriodWater)}</td>
      <td class="name">${periodLabel(rec.invoicePeriodWater)}</td>
      <td>${fmtEUR(parseFloat(rec.precoAgua)||0)}</td>
      <td>${r.A.pctElec.toFixed(1)}%</td>
      <td>${r.A.pctAgua.toFixed(1)}%</td>
      <td>${fmtEUR(r.A.total)}</td>
      <td>${fmtEUR(r.B.total)}</td>
      <td></td>
    </tr>`);
    const actionsTd = tr.querySelector('td:last-child');
    const openBtn = el('<button class="btn btn-sm">Abrir</button>');
    openBtn.addEventListener('click', ()=> loadRecordIntoDraft(rec));
    const delBtn = el('<button class="btn btn-sm btn-danger" style="margin-left:6px;">Apagar</button>');
    delBtn.addEventListener('click', ()=> deleteRecord(rec.id));
    actionsTd.appendChild(openBtn); actionsTd.appendChild(delBtn);
    tbody.appendChild(tr);
  });
  scroll.appendChild(table);
  wrap.appendChild(scroll);
  return wrap;
}

loadAll();
</script>
</body>
</html>
